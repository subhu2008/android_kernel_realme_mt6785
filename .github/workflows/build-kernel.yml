name: Build RM6785 kernel

on:
  workflow_dispatch:
    inputs:
      build_bakasu:
        description: "Build with BakaSU (4.14 manual hooks)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# Serialize builds on a branch so a run is not cancelled before ccache saves.
concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  build:
    name: Build kernel (RM6785_defconfig + mali_kbase_dri.config)
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      BUILD_BAKASU: ${{ github.event.inputs.build_bakasu }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Prepare BakaSU version info
        if: github.event.inputs.build_bakasu == 'true'
        run: |
          git -C KernelSU fetch --tags --unshallow origin 2>/dev/null || git -C KernelSU fetch --tags origin
          echo "BakaSU revision: $(git -C KernelSU describe --tags --always --dirty)"

      - name: Install build dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail

          # Fresh runner images sometimes still have apt/dpkg lock holders.
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo pkill -9 -f '[u]nattended-upgrade' 2>/dev/null || true

          APT_OPTS=(
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=180
            -o Dpkg::Options::=--force-confdef
            -o Dpkg::Options::=--force-confold
          )

          sudo env DEBIAN_FRONTEND=noninteractive timeout 300 \
            apt-get "${APT_OPTS[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 900 \
            apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
              bc bison flex libssl-dev libelf-dev libncurses-dev \
              ccache clang clang-21 lld lld-21 llvm llvm-21 \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              cpio kmod device-tree-compiler xz-utils zstd lz4 \
              python3 perl

      - name: Verify Clang 21 toolchain
        run: |
          echo "--- toolchain versions ---"
          clang --version
          ld.lld --version
          ccache --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          clang --version | grep -q 'clang version 21\.' || {
            echo "::error::Clang 21 is required, but the default clang is not version 21"
            exit 1
          }
          ld.lld --version | grep -Eq '(LLVM|LLD) 21\.' || {
            echo "::error::LLD 21 is required, but the default ld.lld is not version 21"
            exit 1
          }

      # Full LTO + -j8 can be memory hungry on a 4-core/16 GB runner.
      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: rm6785-${{ runner.os }}-clang21
          max-size: 5G
          verbose: "0"

      - name: Configure kernel
        shell: bash
        run: |
          configs=(RM6785_defconfig mali_kbase_dri.config)
          if [ "${BUILD_BAKASU:-false}" = "true" ]; then
            echo "BakaSU enabled: merging arch/arm64/configs/bakasu.config"
            configs+=(bakasu.config)
          else
            echo "BakaSU disabled: building without CONFIG_KSU"
          fi
          .github/scripts/kernel-make.sh "${configs[@]}"

      - name: Build kernel
        run: |
          .github/scripts/kernel-make.sh

      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true

      - name: Collect Image and other kernel artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts

          # Pick up every Image variant, wherever the build put it.
          mapfile -d '' images < <(
            find out -type f \
              \( -name 'Image' -o -name 'Image.*' -o -name 'Image-dtb' \) \
              -print0 2>/dev/null || true
          )

          if [ "${#images[@]}" -gt 0 ]; then
            printf 'Found Image artifacts:\n'
            printf '  %s\n' "${images[@]}"
            cp --parents "${images[@]}" artifacts/
          else
            echo "::warning::No Image file was found under out/"
          fi

          # Helpful companions for flashing/debugging.
          find out -maxdepth 1 -type f \
            \( -name '.config' -o -name 'System.map' -o -name 'vmlinux' -o -name 'Module.symvers' \) \
            -exec cp --parents {} artifacts/ \; 2>/dev/null || true
          find out/arch/arm64/boot/dts -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} artifacts/ \; 2>/dev/null || true

          echo "--- artifact contents ---"
          find artifacts -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RM6785-kernel-${{ github.run_number }}${{ github.event.inputs.build_bakasu == 'true' && '-bakasu' || '' }}
          path: artifacts/
          if-no-files-found: warn
          # actions/upload-artifact skips dotfiles (including out/.config) by default.
          include-hidden-files: true
          retention-days: 30
